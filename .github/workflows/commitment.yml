name: commitment CI

on:
  push:
    paths:
      - "commitment/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/commitment.yml"
  pull_request:
    paths:
      - "commitment/**"
      - "go.work"
      - "go.work.sum"
      - ".github/workflows/commitment.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commitment
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: commitment/go.mod
      - name: Download dependencies
        run: go mod download
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
